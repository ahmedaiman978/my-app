apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ahmedaiman978/my-app.git
    targetRevision: dev          # watches dev branch
    path: overlays/dev           # uses dev overlay

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      selfHeal: true             # auto fix drift ✅
      prune: true                # remove deleted resources ✅
    syncOptions:
      - CreateNamespace=true     # create namespace if not exists ✅
