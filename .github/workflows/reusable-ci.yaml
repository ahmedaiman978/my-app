name: reusable-ci

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      overlay_path:
        required: true
        type: string
      image_name:
        required: false
        type: string
        default: my-app
    secrets:
      GIT_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      NVD_API_KEY:
        required: true

jobs:
  build-test-push-update:
    name: Build, test, push, and update manifests
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run application tests
        run: npm test

      - name: Start SonarQube container
        run: |
          docker run -d --name sonarqube \
            -p 9000:9000 \
            sonarqube:lts-community

      - name: Wait for SonarQube to be ready
        run: |
          echo "Waiting for SonarQube to be ready..."
          for i in {1..90}; do
            STATUS=$(curl -s http://localhost:9000/api/system/status | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
            echo "Current SonarQube status: $STATUS"
            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is ready."
              exit 0
            fi
            sleep 10
          done
          echo "SonarQube did not become ready in time."
          docker logs sonarqube
          exit 1

      - name: Generate SonarQube token
        id: sonar_token
        run: |
          RESPONSE=$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=github-actions-token")
          TOKEN=$(echo "$RESPONSE" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$TOKEN" ]; then
            echo "Failed to generate SonarQube token"
            echo "$RESPONSE"
            exit 1
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SonarScanner CLI
        run: |
          SONAR_SCANNER_VERSION=5.0.1.3006
          curl -fsSL -o sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux.zip
          unzip -o sonar-scanner.zip
          echo "$PWD/sonar-scanner-${SONAR_SCANNER_VERSION}-linux/bin" >> $GITHUB_PATH

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ steps.sonar_token.outputs.token }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=${{ inputs.image_name }} \
            -Dsonar.projectName=${{ inputs.image_name }} \
            -Dsonar.projectVersion=${{ github.sha }} \
            -Dsonar.sources=. \
            -Dsonar.tests=. \
            -Dsonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.ts \
            -Dsonar.exclusions=node_modules/**,coverage/**,.git/**,dist/**,build/**,security-reports/**,reports/**,dependency-check/**,.dependency-check-data/** \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=$SONAR_TOKEN

      - name: Export SonarQube summary
        env:
          SONAR_TOKEN: ${{ steps.sonar_token.outputs.token }}
          PROJECT_NAME: ${{ inputs.image_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p security-reports/sonarqube

          curl -s -u "${SONAR_TOKEN}:" \
            "http://localhost:9000/api/qualitygates/project_status?projectKey=${PROJECT_NAME}" \
            > quality-gate.json

          curl -s -u "${SONAR_TOKEN}:" \
            "http://localhost:9000/api/measures/component?component=${PROJECT_NAME}&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc,security_rating,reliability_rating,sqale_rating" \
            > measures.json

          python3 - <<'PY'
          import json
          import os

          project_name = os.environ["PROJECT_NAME"]
          commit_sha = os.environ["COMMIT_SHA"]

          with open("quality-gate.json") as f:
              quality_data = json.load(f)

          with open("measures.json") as f:
              measures_data = json.load(f)

          quality_gate = quality_data.get("projectStatus", {}).get("status", "UNKNOWN")

          measures = {}
          for m in measures_data.get("component", {}).get("measures", []):
              measures[m["metric"]] = m.get("value", "N/A")

          def rating(value):
              mapping = {
                  "1.0": "A",
                  "2.0": "B",
                  "3.0": "C",
                  "4.0": "D",
                  "5.0": "E"
              }
              return mapping.get(str(value), value if value is not None else "N/A")

          def percent(value):
              return f"{value}%" if value not in (None, "N/A", "") else "N/A"

          with open("security-reports/sonarqube/sonarqube-summary.md", "w") as out:
              out.write("# SonarQube Summary\n\n")
              out.write(f"- **Project:** {project_name}\n")
              out.write(f"- **Commit:** {commit_sha}\n")
              out.write(f"- **Quality Gate:** {quality_gate}\n\n")
              out.write("## Metrics\n\n")
              out.write("| Metric | Value |\n")
              out.write("|---|---|\n")
              out.write(f"| Bugs | {measures.get('bugs', 'N/A')} |\n")
              out.write(f"| Vulnerabilities | {measures.get('vulnerabilities', 'N/A')} |\n")
              out.write(f"| Code Smells | {measures.get('code_smells', 'N/A')} |\n")
              out.write(f"| Coverage | {percent(measures.get('coverage', 'N/A'))} |\n")
              out.write(f"| Duplicated Lines Density | {percent(measures.get('duplicated_lines_density', 'N/A'))} |\n")
              out.write(f"| Lines of Code | {measures.get('ncloc', 'N/A')} |\n")
              out.write(f"| Security Rating | {rating(measures.get('security_rating'))} |\n")
              out.write(f"| Reliability Rating | {rating(measures.get('reliability_rating'))} |\n")
              out.write(f"| Maintainability Rating | {rating(measures.get('sqale_rating'))} |\n")
          PY

          rm -f quality-gate.json measures.json

      - name: Run dependency vulnerability audit
        run: npm audit --audit-level=high || true

      - name: Install OWASP Dependency-Check
        run: |
          DC_VERSION=10.0.4
          curl -fsSL -o dependency-check.zip "https://github.com/dependency-check/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          unzip -o dependency-check.zip

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: .dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        continue-on-error: true
        run: |
          mkdir -p reports
          mkdir -p .dependency-check-data

          ./dependency-check/bin/dependency-check.sh \
            --project "${{ inputs.image_name }}" \
            --scan . \
            --format "HTML" \
            --format "JSON" \
            --out reports \
            --data .dependency-check-data \
            --nvdApiKey "${{ secrets.NVD_API_KEY }}" \
            --nvdApiDelay 12000 \
            --nvdApiEndpoint "https://services.nvd.nist.gov/rest/json/cves/2.0" \
            --nvdCveUrlModified "https://services.nvd.nist.gov/rest/json/cves/2.0?lastModStartDate={0}&lastModEndDate={1}" \
            --nvdCveUrlBase "https://services.nvd.nist.gov/rest/json/cves/2.0?startIndex={0}&resultsPerPage={1}" \
            --disableOssIndex

      - name: Generate human-readable OWASP summary
        if: always()
        env:
          PROJECT_NAME: ${{ inputs.image_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p security-reports/owasp

          if [ ! -f reports/dependency-check-report.json ]; then
            echo "# OWASP Dependency-Check Summary" > security-reports/owasp/owasp-summary.md
            echo "" >> security-reports/owasp/owasp-summary.md
            echo "- **Project:** ${PROJECT_NAME}" >> security-reports/owasp/owasp-summary.md
            echo "- **Commit:** ${COMMIT_SHA}" >> security-reports/owasp/owasp-summary.md
            echo "- **Status:** No JSON report found" >> security-reports/owasp/owasp-summary.md
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from collections import Counter

          project_name = os.environ["PROJECT_NAME"]
          commit_sha = os.environ["COMMIT_SHA"]

          with open("reports/dependency-check-report.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          dependencies = data.get("dependencies", [])
          vulnerable_dependencies = []
          severity_counter = Counter()

          for dep in dependencies:
              vulns = dep.get("vulnerabilities", [])
              if vulns:
                  vulnerable_dependencies.append(dep)
                  for v in vulns:
                      severity = (
                          v.get("severity")
                          or v.get("cvssv3", {}).get("baseSeverity")
                          or v.get("cvssv2", {}).get("severity")
                          or "UNKNOWN"
                      )
                      severity_counter[severity.upper()] += 1

          total_dependencies = len(dependencies)
          total_vulnerable = len(vulnerable_dependencies)
          total_vulns = sum(len(dep.get("vulnerabilities", [])) for dep in vulnerable_dependencies)

          severity_order = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]

          with open("security-reports/owasp/owasp-summary.md", "w", encoding="utf-8") as out:
              out.write("# OWASP Dependency-Check Summary\n\n")
              out.write(f"- **Project:** {project_name}\n")
              out.write(f"- **Commit:** {commit_sha}\n")
              out.write(f"- **Dependencies scanned:** {total_dependencies}\n")
              out.write(f"- **Vulnerable dependencies:** {total_vulnerable}\n")
              out.write(f"- **Total vulnerabilities:** {total_vulns}\n\n")

              out.write("## Vulnerability Severity Overview\n\n")
              out.write("| Severity | Count |\n")
              out.write("|---|---|\n")
              for sev in severity_order:
                  out.write(f"| {sev} | {severity_counter.get(sev, 0)} |\n")

              out.write("\n## Top Vulnerable Dependencies\n\n")
              out.write("| Dependency | Vulnerabilities |\n")
              out.write("|---|---|\n")

              for dep in vulnerable_dependencies[:20]:
                  name = dep.get("fileName", dep.get("packagePath", "Unknown"))
                  count = len(dep.get("vulnerabilities", []))
                  out.write(f"| {name} | {count} |\n")

              out.write("\n## Vulnerability Details\n\n")

              for dep in vulnerable_dependencies[:20]:
                  name = dep.get("fileName", dep.get("packagePath", "Unknown"))
                  out.write(f"### {name}\n\n")
                  out.write("| ID | Severity | CVSS | Title |\n")
                  out.write("|---|---|---|---|\n")

                  for v in dep.get("vulnerabilities", []):
                      vuln_id = v.get("name", "N/A")
                      severity = (
                          v.get("severity")
                          or v.get("cvssv3", {}).get("baseSeverity")
                          or v.get("cvssv2", {}).get("severity")
                          or "UNKNOWN"
                      )
                      score = (
                          v.get("cvssv3", {}).get("baseScore")
                          or v.get("cvssv2", {}).get("score")
                          or "N/A"
                      )
                      title = v.get("description", "").replace("\n", " ").strip()
                      if len(title) > 120:
                          title = title[:117] + "..."
                      out.write(f"| {vuln_id} | {severity} | {score} | {title} |\n")

                  out.write("\n")
          PY

      - name: Copy OWASP reports into repo folder
        if: always()
        run: |
          mkdir -p security-reports/owasp

          if [ -f reports/dependency-check-report.html ]; then
            cp reports/dependency-check-report.html security-reports/owasp/
          fi

          if [ ! -f security-reports/owasp/owasp-summary.md ]; then
            echo "# OWASP Dependency-Check Summary" > security-reports/owasp/owasp-summary.md
            echo "" >> security-reports/owasp/owasp-summary.md
            echo "No readable OWASP summary could be generated." >> security-reports/owasp/owasp-summary.md
          fi

          if [ ! -f reports/dependency-check-report.html ] && [ ! -f security-reports/owasp/owasp-summary.md ]; then
            echo "No OWASP report found." > security-reports/owasp/README.txt
          fi

      - name: Upload OWASP report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: security-reports/owasp

      - name: Upload SonarQube report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube-report
          path: security-reports/sonarqube

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker buildx build \
            --load \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ inputs.environment }}-latest \
            .

      - name: Smoke test built image
        run: |
          docker run -d --name app-smoke-test -p 3000:3000 ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}
          sleep 8
          curl -f http://localhost:3000/health

      - name: Cleanup smoke test container
        if: always()
        run: |
          docker stop app-smoke-test || true
          docker rm app-smoke-test || true

      - name: Cleanup SonarQube container
        if: always()
        run: |
          docker stop sonarqube || true
          docker rm sonarqube || true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ inputs.environment }}-latest

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"

      - name: Update Kustomize image tag
        run: |
          cd ${{ inputs.overlay_path }}
          kustomize edit set image \
            my-app=${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ github.sha }}

      - name: Commit manifest and report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.overlay_path }}/kustomization.yaml
          git add security-reports
          git diff --cached --quiet && exit 0
          git commit -m "ci: update ${{ inputs.environment }} image and security reports to ${{ github.sha }} [skip ci]"
          git push
