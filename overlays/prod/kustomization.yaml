apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


namespace: prod

images:
- name: my-app
  newName: 2871/my-app
  newTag: 8458430e600e1519e2c0a8ef402b52cc87421f97

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: production
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: my-app
resources:
- ../../base
