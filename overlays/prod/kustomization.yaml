apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


namespace: prod

images:
- name: my-app
  newName: 2871/my-app
  newTag: 81202c800f9d7c9264c66c4fef00e23d88f4b4ac

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: production
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: my-app
resources:
- ../../base
