apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


namespace: staging

images:
- name: my-app
  newName: 2871/my-app
  newTag: b5b2c81e98a29fe9e6bc73e9b55506bc5e600697

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: staging
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: my-app
resources:
- ../../base
