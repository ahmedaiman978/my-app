apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


namespace: staging

images:
- name: my-app
  newName: 2871/my-app
  newTag: 4513a7c142c8db7cf256a9942c9eb50836d26371

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: staging
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: my-app
resources:
- ../../base
