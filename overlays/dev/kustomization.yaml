apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namespace: dev

# Image will be updated by GitHub Actions automatically
images:
  - name: my-app
    newName: docker.io/ahmedaiman978@gmail.com  /my-app
    newTag: latest

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
    target:
      kind: Deployment
      name: my-app
