apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


namespace: dev

# Image will be updated by GitHub Actions automatically
images:
- name: my-app
  newName: 2871/my-app
  newTag: 72077d85ca2b07dcc33b56c7aacf1d4dacac7452

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: dev
  target:
    kind: Deployment
    name: my-app
resources:
- ../../base
