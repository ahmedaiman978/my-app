apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


namespace: dev

# Image will be updated by GitHub Actions automatically
images:
- name: my-app
  newName: 2871/my-app
  newTag: 986ad4d8db4d520dc0696b1f3820943081cb88df

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: dev
  target:
    kind: Deployment
    name: my-app
resources:
- ../../base
