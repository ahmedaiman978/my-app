apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


namespace: dev

# Image will be updated by GitHub Actions automatically
images:
- name: 2871/my-app
  newName: 2871/my-app
  newTag: 11a056e268a7d2a74239c4cdef0bfd751daefcc0
- name: my-app
  newName: 2871/my-app
  newTag: 4ffb950bca72754c1211852e7f96bd080984a267

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: dev
  target:
    kind: Deployment
    name: my-app
resources:
- ../../base
